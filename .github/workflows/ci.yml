name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Build the devenv shell and run git hooks
        run: devenv test

      - name: Build
        run: devenv shell --quiet odin build .

      - name: Test lexer
        run: devenv shell --quiet odin test lexer/

      - name: Test parser
        run: devenv shell --quiet odin test parser/
