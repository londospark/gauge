name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Odin (latest prebuilt nightly)
        run: |
          asset=$(curl -fsSL https://api.github.com/repos/odin-lang/Odin/releases/latest \
            | jq -r '.assets[] | select(.name | contains("linux-amd64")) | .browser_download_url')
          curl -fsSL -o odin.tar.gz "$asset"
          tar -xzf odin.tar.gz
          mv odin-linux-amd64-nightly+*/ odin
          echo "$GITHUB_WORKSPACE/odin" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$GITHUB_WORKSPACE/odin" >> "$GITHUB_ENV"

      - name: Check Odin
        run: odin version

      - name: Build
        run: odin build .

      - name: Test lexer
        if: always()
        run: odin test lexer/ -define:ODIN_TEST_JSON_REPORT=lexer.json

      - name: Test parser
        if: always()
        run: odin test parser/ -define:ODIN_TEST_JSON_REPORT=parser.json

      - name: Test integration
        if: always()
        run: odin test integration/ -define:ODIN_TEST_JSON_REPORT=integration.json

      - name: Convert test reports to JUnit
        if: always()
        run: |
          mkdir -p junit
          for report in *.json; do
            python3 scripts/json_to_junit.py "$report" > "junit/${report%.json}.xml"
          done

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6.4.2
        with:
          report_paths: junit/*.xml
          token: ${{ github.token }}
