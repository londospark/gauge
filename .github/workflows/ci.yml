name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Odin (latest prebuilt nightly)
        run: |
          asset=$(curl -fsSL https://api.github.com/repos/odin-lang/Odin/releases/latest \
            | jq -r '.assets[] | select(.name | contains("linux-amd64")) | .browser_download_url')
          curl -fsSL -o odin.tar.gz "$asset"
          tar -xzf odin.tar.gz
          mv odin-linux-amd64-nightly+*/ odin
          echo "$GITHUB_WORKSPACE/odin" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$GITHUB_WORKSPACE/odin" >> "$GITHUB_ENV"

      - name: Check Odin
        run: odin version

      - name: Build
        run: odin build .

      - name: Test lexer
        run: |
          set +e
          output=$(odin test lexer/ 2>&1)
          status=$?
          set -e

          echo "::group::odin test lexer"
          printf '%s\n' "$output"
          echo "::endgroup::"

          result=$(printf '%s\n' "$output" | grep -E '^Finished ' | tail -1 || true)
          failures=$(printf '%s\n' "$output" | grep -E '^[[:space:]]+- ' | sed 's/^[[:space:]]*//' || true)

          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### lexer"
              echo "\`${result:-no summary line}\`"
              if [ -n "$failures" ]; then
                echo ""
                echo '```'
                printf '%s\n' "$failures"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$failures" ]; then
            while IFS= read -r line; do
              safe=${line//%/%25}
              echo "::error::lexer: $safe"
            done <<< "$failures"
          fi

          exit $status

      - name: Test parser
        run: |
          set +e
          output=$(odin test parser/ 2>&1)
          status=$?
          set -e

          echo "::group::odin test parser"
          printf '%s\n' "$output"
          echo "::endgroup::"

          result=$(printf '%s\n' "$output" | grep -E '^Finished ' | tail -1 || true)
          failures=$(printf '%s\n' "$output" | grep -E '^[[:space:]]+- ' | sed 's/^[[:space:]]*//' || true)

          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### parser"
              echo "\`${result:-no summary line}\`"
              if [ -n "$failures" ]; then
                echo ""
                echo '```'
                printf '%s\n' "$failures"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$failures" ]; then
            while IFS= read -r line; do
              safe=${line//%/%25}
              echo "::error::parser: $safe"
            done <<< "$failures"
          fi

          exit $status
