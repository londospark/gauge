name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unix-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-amd64
            artifact: gauge-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
            artifact: gauge-linux-arm64
          - runner: macos-14
            asset: macos-arm64
            artifact: gauge-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Odin (latest prebuilt nightly)
        run: |
          asset=$(curl -fsSL https://api.github.com/repos/odin-lang/Odin/releases/latest \
            | jq -r '.assets[] | select(.name | contains("${{ matrix.asset }}")) | .browser_download_url')
          curl -fsSL -o odin.tar.gz "$asset"
          tar -xzf odin.tar.gz
          mv odin-*/ odin
          echo "$GITHUB_WORKSPACE/odin" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$GITHUB_WORKSPACE/odin" >> "$GITHUB_ENV"

      - name: Check Odin
        run: odin version

      - name: Build
        run: odin build .

      - name: Upload gauge binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: gauge

      - name: Test compiler
        if: always()
        run: odin test compiler/ -define:ODIN_TEST_JSON_REPORT=compiler.json -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Convert test reports to JUnit
        if: always()
        run: |
          mkdir -p junit
          for report in *.json; do
            python3 scripts/json_to_junit.py "$report" > "junit/${report%.json}.xml"
          done

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6.4.2
        with:
          report_paths: junit/*.xml
          token: ${{ github.token }}

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Odin (latest prebuilt nightly)
        shell: pwsh
        run: |
          $asset = (Invoke-RestMethod https://api.github.com/repos/odin-lang/Odin/releases/latest).assets |
            Where-Object { $_.name -like "*windows-amd64*" } |
            Select-Object -First 1 -ExpandProperty browser_download_url
          Invoke-WebRequest -Uri $asset -OutFile odin.zip
          Expand-Archive -Path odin.zip -DestinationPath odin
          $odinDir = (Get-ChildItem odin -Directory | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_PATH -Value $odinDir
          "ODIN_ROOT=$odinDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC (cl judges the e2e tests)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with the C++ toolset not found" }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          # vcvarsall mutates the process environment; capture the result
          # and replay it into GITHUB_ENV/GITHUB_PATH so every later step
          # sees cl, INCLUDE, LIB and the rest. PATH goes through
          # GITHUB_PATH, which prepends, keeping the merged value's
          # priority intact.
          $envLines = cmd /c "call `"$vcvars`" x64 >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat exited $LASTEXITCODE" }

          foreach ($line in $envLines) {
            $i = $line.IndexOf('=')
            if ($i -le 0) { continue }
            $key = $line.Substring(0, $i)
            $value = $line.Substring($i + 1)
            if ($key -ieq 'PATH') {
              Add-Content -Path $env:GITHUB_PATH -Value $value
            } else {
              Add-Content -Path $env:GITHUB_ENV -Value "$key=$value"
            }
          }

      - name: Check Odin
        run: odin version

      - name: Build
        run: odin build .

      - name: Upload gauge binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gauge-windows-amd64
          path: gauge.exe

      - name: Test compiler
        run: odin test compiler/ -define:ODIN_TEST_JSON_REPORT=compiler.json -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Convert test reports to JUnit
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path junit -Force | Out-Null
          Get-ChildItem -Filter *.json | ForEach-Object {
            python scripts/json_to_junit.py $_.Name > "junit\$($_.BaseName).xml"
          }

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6.4.2
        with:
          report_paths: junit/*.xml
          token: ${{ github.token }}

      - name: Demo end-to-end (gauge -> C -> cl -> run)
        run: .\gauge.exe -time demo.gauge
